[package]
name = "zephyr-music"
version = "1.0.4"
description = "Zephyr · 现代化本地音乐播放器"
authors = ["Zephyr"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zephyr_music_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
urlencoding = "2"
rodio = "0.19"
lofty = "0.21"
reqwest = { version = "0.12", features = ["json", "multipart", "gzip"] }
aes = "0.8"
md5 = "0.7"
rand = "0.8"
flate2 = "1"
num-bigint = "0.4"
# 安全持久化：系统凭据库存储加密密钥 + AES-GCM 加密 cookie
keyring = "3"
aes-gcm = "0.10"
base64 = "0.22"
# 显式声明 tokio（带 time feature），用于 ncbl_scrobble_v1 中的异步非阻塞 sleep。
# 避免 std::thread::sleep 阻塞 Tauri async 运行时。
tokio = { version = "1", features = ["time"] }

# This feature is enabled by `tauri build` (production). It tells the tauri
# crate to embed the frontendDist into the binary (custom protocol) instead of
# loading from devUrl at runtime. When building with plain `cargo build` for
# a release, you MUST pass `--features custom-protocol` or the exe will try
# to load the frontend from http://localhost:1420 at runtime (blank window).
[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = 3
strip = true
